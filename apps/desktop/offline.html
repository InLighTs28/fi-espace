<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>FI espace — connexion impossible</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:linear-gradient(125deg,#0c3a2c,#0f7a55 50%,#1798a8);color:#fffdf2;text-align:center;padding:24px}
.card{max-width:440px}.cross{font:48px Georgia,serif;color:#f7d98a}h1{font-size:22px;margin:12px 0 8px}p{opacity:.85;line-height:1.6}
button{margin-top:18px;border:0;border-radius:10px;padding:12px 20px;font-weight:600;background:#f7d98a;color:#0c3a2c;cursor:pointer}</style></head>
<body><div class="card"><div class="cross">✝</div><h1 id="t">Pas de connexion Internet</h1>
<p id="m">FI espace a besoin d’Internet pour afficher les données de la FI. Vérifiez votre connexion puis réessayez.</p>
<button id="retry">Réessayer</button></div>
<script>
  const q = new URLSearchParams(location.search);
  const site = q.get('site') || 'https://inlights28.github.io/fi-espace/';
  if (q.get('code')) {
    document.getElementById('t').textContent = 'Le site ne répond pas correctement';
    document.getElementById('m').textContent = 'Le serveur a renvoyé une erreur (' + q.get('code') + '). Si cela persiste, installez la dernière version de FI espace.';
  }
  document.getElementById('retry').onclick = () => { if (/^https:\/\//.test(site)) location.href = site; };
</script></body></html>
